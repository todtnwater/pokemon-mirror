spring.application.name=pokemon-mirror

# Cloudflare Tunnel만 접속하도록 내부 주소에만 엽니다.
server.address=127.0.0.1
server.port=8090

# 내부 Python AI 서버 (CLIP 계산 담당)
mirror.ai.base-url=http://127.0.0.1:8091
mirror.ai.timeout-ms=3000

# 웹캠 프레임 1장 최대 크기 (320px JPEG는 보통 10~30KB)
mirror.max-upload-bytes=300000

# 접속자(IP) 1명당 1초에 허용할 요청 수 (페이지는 초당 최대 5회 보냄)
mirror.rate-limit-per-second=6

# 같은 포켓몬이 몇 프레임 연속 1등이면 통계에 1번 셀지
mirror.stats.stable-frames=5

# 통계 DB (DB 서버 MySQL). 실제 값은 /etc/pokemon-mirror.env 에 넣고 systemd가 환경변수로 넘겨 줍니다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=3000
